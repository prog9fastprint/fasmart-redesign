<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="background:var(--alt-bg); padding:80px 24px; font-family:'Inter',sans-serif; color:var(--ink)">
  <div style="max-width:1000px; margin:0 auto; display:grid; grid-template-columns:1fr 1fr; gap:48px; align-items:start">
    <div>
      <div style="color:var(--gold-dark); font-weight:700; font-size:14px; margin-bottom:8px">HUBUNGI KAMI</div>
      <h2 style="font-family:'Poppins',sans-serif; font-size:32px; font-weight:800; margin:0 0 16px">Siap Bantu Impor Barang Anda</h2>
      <p style="color:var(--muted); font-size:15px; line-height:1.7; margin:0 0 24px">Isi form atau hubungi kami langsung via WhatsApp untuk konsultasi gratis kebutuhan impor Anda.</p>
      <div style="display:flex; flex-direction:column; gap:14px; font-size:14px">
        <div><span style="font-weight:700">WhatsApp:</span> <span style="color:var(--muted)">+62 812-3456-7890</span></div>
        <div><span style="font-weight:700">Email:</span> <span style="color:var(--muted)">[email protected]</span></div>
        <div><span style="font-weight:700">Jam Operasional:</span> <span style="color:var(--muted)">Senin - Sabtu, 09:00 - 18:00</span></div>
      </div>
    </div>
    <div style="background:var(--bg); border-radius:16px; padding:28px; border:1px solid var(--border); display:flex; flex-direction:column; gap:14px">
      <div>
        <label style="font-size:13px; font-weight:600; display:block; margin-bottom:6px">Nama</label>
        <input type="text" value="{{ form.name }}" onChange="{{ onNameChange }}" placeholder="Nama Anda" style="width:100%; padding:12px 14px; border-radius:10px; border:1px solid var(--border); font-size:14px"></input>
      </div>
      <div>
        <label style="font-size:13px; font-weight:600; display:block; margin-bottom:6px">No. WhatsApp</label>
        <input type="text" value="{{ form.phone }}" onChange="{{ onPhoneChange }}" placeholder="08xx-xxxx-xxxx" style="width:100%; padding:12px 14px; border-radius:10px; border:1px solid var(--border); font-size:14px"></input>
      </div>
      <div>
        <label style="font-size:13px; font-weight:600; display:block; margin-bottom:6px">Kebutuhan</label>
        <textarea value="{{ form.need }}" onChange="{{ onNeedChange }}" placeholder="Ceritakan barang yang ingin diimpor" rows="3" style="width:100%; padding:12px 14px; border-radius:10px; border:1px solid var(--border); font-size:14px; font-family:'Inter',sans-serif; resize:vertical"></textarea>
      </div>
      <button onClick="{{ onSubmit }}" style="background:var(--ink); color:var(--bg); font-weight:700; font-size:15px; padding:14px; border-radius:10px; border:none; cursor:pointer; margin-top:4px">Kirim via WhatsApp</button>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;form&quot;: {&quot;editor&quot;: null, &quot;default&quot;: {&quot;name&quot;:&quot;&quot;,&quot;phone&quot;:&quot;&quot;,&quot;need&quot;:&quot;&quot;}, &quot;tsType&quot;: &quot;{name:string,phone:string,need:string}&quot;}, &quot;onNameChange&quot;: {&quot;editor&quot;: null, &quot;tsType&quot;: &quot;(e:any)=&gt;void&quot;}, &quot;onPhoneChange&quot;: {&quot;editor&quot;: null, &quot;tsType&quot;: &quot;(e:any)=&gt;void&quot;}, &quot;onNeedChange&quot;: {&quot;editor&quot;: null, &quot;tsType&quot;: &quot;(e:any)=&gt;void&quot;}, &quot;onSubmit&quot;: {&quot;editor&quot;: null, &quot;tsType&quot;: &quot;()=&gt;void&quot;}}"></script>
</body>
</html>
